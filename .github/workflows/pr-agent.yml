# pr-agent (OSS) — Qodo Merge / PR-Agent on our OPENAI_KEY (trial-independent).
#
# This repo is PUBLIC; wave-av/wave-foundation is PRIVATE, and GitHub Actions does NOT
# allow a public repo to consume a private reusable workflow (same constraint as
# foundation-gate.yml). Invoke the public OSS action directly instead of
# uses: wave-av/wave-foundation/.github/workflows/reusable-pr-agent.yml.
name: pr-agent (OSS)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run pr-agent (OSS)
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
